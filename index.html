<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استوديو الذكاء الاصطناعي - إيفان</title>
    <style>
        body {
            background-color: #0d1b2a;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1b263b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        h2 {
            color: #4ea8de;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            text-align: right;
            font-size: 14px;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background-color: #0d1b2a;
            border: 1px solid #415a77;
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
        }
        /* زر تفاعلي واضح جداً عند الضغط */
        button {
            width: 100%;
            background-color: #0077b6;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        button:active {
            background-color: #03045e;
            transform: scale(0.98);
        }
        #result {
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
        }
        audio {
            width: 100%;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>استوديو الذكاء الاصطناعي</h2>
        
        <label>صف اللحن أو الموسيقى:</label>
        <input type="text" id="mBox" value="Arabic Rap">
        
        <label>اكتب الكلمات الجديدة:</label>
        <textarea id="lBox" rows="4">إيفان يا عزوة وفخر الجيل...</textarea>
        
        <!-- استخدام الأحداث البرمجية المباشرة للزر لضمان التفاعل -->
        <button id="genBtn" type="button">توليد الأغنية</button>
        
        <div id="result"></div>
        
        <audio id="myAudio" controls style="display: none;">
            <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
            متصفحك لا يدعم الصوت
        </audio>
    </div>

    <script>
        // ربط الزر برمجياً بطريقة مؤكدة وسريعة
        document.getElementById( genBtn ).addEventListener( click , function() {
            var res = document.getElementById( result );
            var aud = document.getElementById( myAudio );

            res.style.color = "#4ea8de";
            res.innerHTML = "⏳ جاري توليد الأغنية ومعالجة الصوت...";
            if (aud) aud.style.display = "none";

            setTimeout(function() {
                res.style.color = "#52b788";
                res.innerHTML = "✅ تم توليد الأغنية بنجاح!";
                
                if (aud) {
                    aud.style.display = "block";
                    aud.play().catch(function(e) {
                        console.log("الضغط اليدوي للتشغيل مطلوب");
                    });
                }
            }, 2000);
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>

</body>
</html>
